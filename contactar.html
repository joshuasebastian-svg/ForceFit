<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos | Force Fit</title>
    
    <!-- Enlace a tu CSS externo por si lo necesitas -->
    <link rel="stylesheet" href="estilos.css">
    
    <!-- Iconos de FontAwesome arreglados para que se vean las redes y los indicadores -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* --- VARIABLES DE DISEÑO --- */
        :root {
            --bg-main: #121212;        /* Fondo oscuro principal */
            --bg-card: #1a1a1a;        /* Fondo de la tarjeta */
            --bg-input: #262626;       /* Fondo de los campos */
            --accent: #ff5722;         /* Naranja Force Fit */
            --text-light: #ffffff;     /* Texto blanco */
            --text-muted: #9e9e9e;     /* Texto secundario gris */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            display: flex;
            flex-direction: column;    /* NUEVO: Apila el menú arriba y el formulario abajo */
            align-items: center;
            min-height: 100vh;
            padding: 0 20px 40px 20px;
        }

        /* --- ESTILOS DE LA BARRA DE NAVEGACIÓN SUPERIOR --- */
        nav {
            width: 100%;
            max-width: 1100px;         /* Ajustado para medir lo mismo que el formulario */
            display: flex;
            justify-content: flex-end; /* Coloca los botones a la derecha. Cambia a 'center' para centrarlos */
            padding: 30px 0;
        }

        nav ul {
            display: flex;             /* Pone los botones uno al lado del otro en horizontal */
            gap: 30px;                 /* Separación física entre cada botón */
            list-style: none;          /* Quita los puntos de la lista */
        }

        nav ul li a {
            color: var(--text-light);
            text-decoration: none;     /* Elimina la línea inferior de los enlaces */
            font-size: 0.95rem;
            text-transform: uppercase; /* Fuerza el texto a mayúsculas */
            font-weight: bold;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        /* Color naranja al pasar el mouse por encima o al estar activo */
        nav ul li a:hover,
        nav ul li a.active {
            color: var(--accent);
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .contact-container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: 1.2fr 1fr;
        }

        /* --- COLUMNA DEL FORMULARIO --- */
        .form-side {
            padding: 50px;
        }

        .form-side h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .form-side h1 span {
            color: var(--accent);
        }

        .form-side p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 14px;
            color: var(--text-light);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background-color: #333333;
        }

        textarea.form-input {
            resize: none;
            min-height: 120px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: var(--text-light);
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-submit:hover {
            background-color: #e04716;
            transform: translateY(-2px);
        }

        /* --- COLUMNA DE INFORMACIÓN --- */
        .info-side {
            background: linear-gradient(135deg, rgba(18, 18, 18, 0.9), rgba(255, 87, 34, 0.25)),
                        url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .info-header h2 {
            font-size: 1.8rem;
            text-transform: uppercase;
            border-left: 4px solid var(--accent);
            padding-left: 15px;
            margin-bottom: 35px;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .info-item i {
            color: var(--accent);
            font-size: 1.4rem;
            margin-top: 3px;
        }

        .info-item h3 {
            font-size: 1rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-item p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .social-box p {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            color: var(--text-light);
            background-color: rgba(255, 255, 255, 0.1);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background-color: var(--accent);
            transform: scale(1.1);
        }

        /* --- RESPONSIVO --- */
        @media (max-width: 850px) {
            nav {
                justify-content: center;
            }
            .contact-container {
                grid-template-columns: 1fr;
            }
            .info-side {
                order: -1;
                min-height: 350px;
            }
            .form-side, .info-side {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

    <!-- Menú de navegación en la posición correcta -->
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="quienessomos.html">Quiénes somos</a></li>
            <li><a href="contactar.html" class="active">Contáctanos</a></li>
        </ul>
    </nav>

    <!-- Contenedor del Formulario -->
    <div class="contact-container">
        <!-- Lado del Formulario -->
        <div class="form-side">
            <h1>Hablemos de <span>Fuerza</span></h1>
            <p>Escríbenos para agendar una clase de prueba o resolver tus dudas con un entrenador.</p>
            
            <form action="#">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" class="form-input" placeholder="Tu nombre completo" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-input" placeholder="ejemplo@correo.com" required>
                </div>
                
                <div class="form-group">
                    <label for="interest">¿Qué plan te interesa?</label>
                    <select id="interest" class="form-input" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="crossfit">CrossFit / HIIT</option>
                        <option value="personal">Entrenador Personal</option>
                        <option value="musculacion">Musculación Funcional</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" class="form-input" placeholder="Cuéntanos tus metas de entrenamiento..." required></textarea>
                </div>
                
                <button type="submit" class="btn-submit">Enviar Datos</button>
            </form>
        </div>

        <!-- Lado de Información -->
        <div class="info-side">
            <div class="info-header">
                <h2>Contacto</h2>
                
                <div class="info-list">
                    <div class="info-item">
